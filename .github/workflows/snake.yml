name: generate animation

on:
  schedule:
    - cron: "0 */2 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: suresurya
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=green&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=green&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353

      - name: push to output branch
        run: |
          cd dist || { echo "❌ dist/ directory not found"; exit 1; }

          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout --orphan output
          git add -A

          if git diff --cached --quiet; then
            echo "⚠️ No changes to commit"
          else
            git commit -m "chore: update contribution snake animation"
            git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
            git push --force origin output
            echo "✅ Successfully pushed to output branch"
          fi
