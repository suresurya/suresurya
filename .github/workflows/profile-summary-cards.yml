name: Profile Summary Cards\n\non: [push]\n\njobs:\n  build:\n    runs-on: ubuntu-latest\n    steps:\n    - name: Checkout Code\n      uses: actions/checkout@v4\n\n    - name: Set up Node.js\n      uses: actions/setup-node@v3\n      with:\n        node-version: '24'\n        always-auth: true\n        registry-url: https://npm.pkg.github.com\n\n    - name: Generate Profile Summary Cards\n      run: node generate-cards.js\n\n    - name: Create Directory\n      run: mkdir -p output\n      continue-on-error: true\n\n    - name: Error Handling\n      run: |\n        if [ ! -d output ]; then echo 'Directory does not exist' >&2; exit 1; fi\n        echo 'Successfully created directory or it already exists.'\n\n    - name: Use PAT_TOKEN as GITHUB_TOKEN\n      env:\n        GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}\n        NODE_ENV: production\n      run: echo 'Using PAT_TOKEN for authentication.'\n