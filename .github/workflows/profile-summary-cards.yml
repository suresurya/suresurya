name: GitHub-Profile-Summary-Cards

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-cards
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v3

      - name: Generate All Themes
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
        with:
          USERNAME: suresurya
          AUTO_PUSH: false

      - name: Set Green Theme
        run: |
          # Use GitHub's green themes for both modes
          mkdir -p profile-summary-card-output/dark-mode
          mkdir -p profile-summary-card-output/light-mode
          cp -r profile-summary-card-output/github_dark/* profile-summary-card-output/dark-mode/
          cp -r profile-summary-card-output/github/* profile-summary-card-output/light-mode/
          
          # Remove all themed folders EXCEPT dark-mode and light-mode
          find profile-summary-card-output/ -maxdepth 1 -mindepth 1 -not -name "dark-mode" -not -name "light-mode" -exec rm -rf {} +

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A profile-summary-card-output/
          git status
          git commit -m "chore: update profile summary cards with random themes [skip ci]" || echo "No changes to commit"
          git push -f origin main
