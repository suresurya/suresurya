name: Profile Summary Cards

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Setup Node.js 24
        uses: actions/setup-node@v2
        with:
          node-version: '24'

      - name: Run Profile Summary Cards
        run: |
          if [ ! -d 'theme' ]; then echo 'Theme directory is missing'; exit 1; fi
          node generate-profile-summary-cards.js || { echo 'Error running script. Checking for ENOENT...'; if [ $? -eq 127 ]; then echo 'Script not found. Please check the path.'; exit 1; } }
        continue-on-error: true
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}