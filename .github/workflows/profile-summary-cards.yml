name: GitHub-Profile-Summary-Cards

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-cards
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Generate All Themes
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: suresurya
          AUTO_PUSH: false

      - name: Set Green Theme
        run: |
          # Use GitHub's green themes for both modes
          mkdir -p profile-summary-card-output/dark-mode
          mkdir -p profile-summary-card-output/light-mode
          
          # Copy generated cards if they exist
          if [ -d "profile-summary-card-output/github_dark" ]; then
            cp -r profile-summary-card-output/github_dark/* profile-summary-card-output/dark-mode/ || true
          fi
          
          if [ -d "profile-summary-card-output/github" ]; then
            cp -r profile-summary-card-output/github/* profile-summary-card-output/light-mode/ || true
          fi
          
          # Remove all themed folders EXCEPT dark-mode and light-mode
          find profile-summary-card-output/ -maxdepth 1 -mindepth 1 -type d -not -name "dark-mode" -not -name "light-mode" -exec rm -rf {} + 2>/dev/null || true

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A profile-summary-card-output/
          git status
          git commit -m "chore: update profile summary cards with random themes [skip ci]" || echo "No changes to commit"
          git push -f origin main
